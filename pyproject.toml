[project]
name = "webhook-hub"
version = "0.1.0"
description = "Inbound Webhook Integration Hub for Odoo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["coverage>=7.6,<8"]
typecheck = ["requests==2.31.0"]

[tool.ruff]
target-version = "py312"

line-length = 119
extend-exclude = []

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
preview = true

select = [
  "B",    # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C",    # flake8-comprehensions
  "COM",  # flake8-commas
  "E",    # pycodestyle Error
  "EM",   # flake8-errmsg
  "EXE",  # flake8-executable
  "F",    # Pyflakes
  "FA",   # flake8-future-annotations
  "FLY",  # flynt
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "INT",  # flake8-gettext
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PLC",  # Pylint Convention
  "PLE",  # Pylint Error
  "PLW",  # Pylint Warning
  "PYI",  # flake8-pyi
  "RET",  # flake8-return
  "RUF",  # Ruff-specific rules
  "SIM",  # flake8-simplify
  "SLOT", # flake8-slots
  "T",    # flake8-print
  "TC",   # flake8-type-checking
  "TID",  # flake8-tidy-imports
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle Warning
  "YTT",  # flake8-2020
]
ignore = [
  "C408",    # unnecessary-collection-call
  "C420",    # unnecessary-dict-comprehension-for-iterable
  "C901",    # complex-structure
  "E266",    # multiple-leading-hashes-for-block-comment
  "E501",    # line-too-long
  "E713",    # not-in-test
  "EM102",   # f-string-in-exception
  "G004",    # logging-f-string: f-strings are the dominant logging style here
  "FA100",   # future-rewritable-type-annotation
  "PGH003",  # blanket-type-ignore
  "PIE790",  # unnecessary-placeholder
  "PIE808",  # unnecessary-range-start
  "PLC2701", # import-private-name
  "PLW2901", # redefined-loop-name
  "RUF001",  # ambiguous-unicode-character-string
  "RUF005",  # collection-literal-concatenation
  "RUF012",  # mutable-class-default
  "RUF100",  # unused-noqa
  "SIM102",  # collapsible-if
  "SIM108",  # if-else-block-instead-of-if-exp
  "SIM117",  # multiple-with-statements
  "TID252",  # relative-imports
  "TRY003",  # raise-vanilla-args
  "TRY300",  # try-consider-else
  "TRY400",  # error-instead-of-exception
  "UP031",   # printf-string-formatting
  "PLC0415", # import-outside-top-level
  "RUF069",  # float-equality-comparison (preview rule)
]

[tool.ruff.lint.per-file-ignores]
# I001:   Odoo __init__.py imports register models; their order is significant.
# RUF067: those same imports are the registration mechanism, not a re-export
#         shim, and post-init hooks and module loggers live here too -- so an
#         Odoo __init__.py is never "docstring + re-exports only".
"**/__init__.py" = ["I001", "RUF067"]

"**/__manifest__.py" = ["B018"]

[tool.pyrefly]
search-path = [".", ".odoo_types", "/opt/odoo/19"]
ignore-missing-imports = []

project-excludes = ["**/__pycache__"]

[tool.pyrefly.errors]
missing-attribute = false
not-iterable = false
bad-argument-type = false
bad-assignment = false
bad-index = false
no-matching-overload = false
unsupported-operation = false
bad-context-manager = false
